### Site settings

title: مدرسه سنگ‌نوردی
tagline: "آموزش سنگ‌نوردی"
description: >-
  سایت مدرسه سنگ‌نوردی. دوره‌های آموزشی و اخبار مدرسه از اینجا منتشر می‌شود.
  climbingschool.ir

lang: fa-IR
locale: fa_IR
timezone: Asia/Tehran

# Allow publishing dated course and news entries ahead of the event date
future: true

baseurl: ""
url: "https://climbingschool.ir"

# Mark used by jekyll-seo-tag (Open Graph / JSON-LD)
logo: /android-chrome-512x512.png

author:
  name: مدرسه سنگ‌نوردی
  url: https://climbingschool.ir/

# Twitter card settings for jekyll-seo-tag
twitter:
  card: summary_large_image

highlighter: rouge
markdown: kramdown

#optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

collections:
  courses:
    output: true
    permalink: /courses/:path/
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /android-chrome-512x512.png
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: courses
    values:
      layout: post
  - scope:
      path: ""
      type: news
    values:
      layout: post

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages
  - _headers
  - _redirects

exclude:
  - README.md
  - LICENSE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - _drafts
  - .cursor
  - .github
  - AGENTS.md
  - _seo
  - script
  - wrangler.toml

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-email-protect

assets:
  css:
    - "rtl.scss"
